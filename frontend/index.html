<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Submission Analyzer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="logo">Project Analyzer</div>
    </header>

    <main class="container">
        <!-- Input Form Section -->
        <section class="card input-section">
            <h2>Evaluate Submission</h2>
            <p class="subtitle">Provide project details and upload a ZIP archive to analyze skills, outcome alignment, and generate viva questions.</p>
            
            <form id="analyze-form">
                <div class="form-group">
                    <label for="project_title">Project Title <span class="required">*</span></label>
                    <input type="text" id="project_title" name="project_title" placeholder="e.g., Inventory Management System" required>
                </div>
                
                <div class="form-group">
                    <label for="project_description">Project Description</label>
                    <textarea id="project_description" name="project_description" rows="3" placeholder="Briefly describe the project structure and features..."></textarea>
                </div>
                
                <div class="form-group">
                    <label for="project_outcomes">Expected Outcomes <span class="required">*</span></label>
                    <textarea id="project_outcomes" name="project_outcomes" rows="3" placeholder="1. Build a REST API&#10;2. Integrate SQLite database" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="questions_per_skill">Questions Per Skill</label>
                    <input type="number" id="questions_per_skill" name="questions_per_skill" value="2" min="1" max="5">
                </div>
                
                <div class="form-group file-upload">
                    <label for="zip_file">Project Archive (.zip) <span class="required">*</span></label>
                    <input type="file" id="zip_file" name="zip_file" accept=".zip" required>
                </div>
                
                <button type="submit" id="submit-btn" class="btn primary-btn">
                    <span class="btn-text">Analyze Project</span>
                </button>
            </form>
        </section>

        <!-- Results & State Section -->
        <section id="results-section" class="results-section">
            <div class="card placeholder-card">
                <div class="placeholder-icon">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <line x1="10" y1="9" x2="8" y2="9"/>
                    </svg>
                </div>
                <h3>Analysis Report</h3>
                <p>Complete the evaluation form and upload the project ZIP archive to generate the static analysis and evaluation details.</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
